# Mount the MCP manager into the active DSH profile.
# The bundle patch from package.json (dsh.bundle.patch) is composed before the
# profile patch; this row instantiates the Host half of the plugin.
#
# The row id must NOT be `mcp-manager`: DSH >= 0.2.3-alpha.2 ships its own row
# with that id (`@deepseek-ai/dsh-mcp-manager` in the dsh-web-app bundle), and a
# later insert reusing the id replaces it. Shadowing it also leaves
# `@deepseek-ai/dsh-mcp-account` pending forever, because that row hard-injects
# `mcpManager`.
- insert:
    - id: dsh-mcp-manager
      name: "@lixiangzhong/dsh-mcp"
