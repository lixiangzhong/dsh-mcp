# 没有任何 MCP insert 行的 profile patch。
- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: dark

# MCP servers managed by dsh-mcp
- insert:
    - id: mcp-fixture
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fixture
        transport: stdio
        command: node
        args:
          - /abs/fixtures/stdio-mcp-server.js
